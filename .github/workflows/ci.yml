name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Env is read lazily at request time, so lint, tests and the build need no credentials.
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate exports/schedule.json
        if: hashFiles('exports/schedule.json') != ''
        run: npm run validate

      - name: Validate exports/schedule_after.json
        if: hashFiles('exports/schedule_after.json') != ''
        run: npm run validate -- --after
