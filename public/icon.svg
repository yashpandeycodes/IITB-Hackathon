<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="0.6" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="10" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background disc for crisp visibility across dark and light browser tabs -->
  <circle cx="24" cy="24" r="23" fill="#070A12" />

  <!-- Outer Orbit Ring -->
  <circle cx="24" cy="24" r="20" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="4 3" />

  <!-- Hexagonal Spatial Network Pathways -->
  <path d="M24 9L37 16.5V31.5L24 39L11 31.5V16.5L24 9Z" stroke="url(#polyGrad)" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M24 9V24M37 16.5L24 24M37 31.5L24 24M24 39V24M11 31.5L24 24M11 16.5L24 24" stroke="rgba(148, 163, 184, 0.65)" stroke-width="1.2" />

  <!-- Central Nexus Core Node with subtle glow -->
  <circle cx="24" cy="24" r="5" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="24" cy="24" r="2.4" fill="#080D1B" />

  <!-- Peripheral Resource Nodes -->
  <circle cx="24" cy="9" r="2.8" fill="#6366F1" />
  <circle cx="37" cy="16.5" r="2.8" fill="#22D3EE" />
  <circle cx="37" cy="31.5" r="2.8" fill="#6366F1" />
  <circle cx="24" cy="39" r="2.8" fill="#22D3EE" />
  <circle cx="11" cy="31.5" r="2.8" fill="#6366F1" />
  <circle cx="11" cy="16.5" r="2.8" fill="#22D3EE" />
</svg>